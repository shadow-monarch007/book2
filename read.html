<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading - The Space Between Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="theme-dark reader-page">
    <div class="progress-container">
        <div class="progress-bar" id="reading-progress"></div>
    </div>

    <nav class="reader-nav" id="reader-nav">
        <div class="nav-left">
            <a href="index.html" class="nav-btn" aria-label="Home">
                <i data-lucide="arrow-left"></i>
            </a>
            <button class="nav-btn" id="btn-toc" aria-label="Table of Contents" title="Table of Contents">
                <i data-lucide="book-open"></i>
            </button>
            <span class="book-title-mini">The Space Between Us</span>
        </div>
        <div class="nav-right">
            <button class="nav-btn" id="btn-audio" aria-label="Toggle Ambient Sound" title="Rain Sounds">
                <i data-lucide="cloud-rain"></i>
            </button>
            <button class="nav-btn" id="btn-font-decrease" aria-label="Decrease Font Size">
                <span class="font-icon small">A</span>
            </button>
            <button class="nav-btn" id="btn-font-increase" aria-label="Increase Font Size">
                <span class="font-icon large">A</span>
            </button>
            <div class="theme-selector">
                <button class="nav-btn theme-btn" data-theme="theme-light" aria-label="Light Mode"><i data-lucide="sun"></i></button>
                <button class="nav-btn theme-btn" data-theme="theme-sepia" aria-label="Sepia Mode"><i data-lucide="coffee"></i></button>
                <button class="nav-btn theme-btn active" data-theme="theme-dark" aria-label="Dark Mode"><i data-lucide="moon"></i></button>
            </div>
        </div>
    </nav>

    <main class="reader-container" id="reader-container">
        <article class="chapter-content fade-in" id="chapter-container">
            <!-- Chapter content will be injected here -->
        </article>

        <div class="chapter-navigation fade-in" id="chapter-nav">
            <button class="nav-chapter-btn" id="btn-prev">
                <i data-lucide="chevron-left"></i> Previous
            </button>
            <button class="nav-chapter-btn" id="btn-next">
                Next <i data-lucide="chevron-right"></i>
            </button>
        </div>
    </main>

    <!-- Ambient Audio (Hidden) -->
    <audio id="ambient-audio" loop preload="none">
        <source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=soft-rain-ambient-111154.mp3" type="audio/mpeg">
    </audio>

    <!-- Table of Contents Drawer -->
    <div class="toc-overlay" id="toc-overlay"></div>
    <aside class="toc-drawer" id="toc-drawer">
        <div class="toc-header">
            <h3>Table of Contents</h3>
            <button class="nav-btn" id="btn-toc-close" aria-label="Close Table of Contents">
                <i data-lucide="x"></i>
            </button>
        </div>
        <ul class="toc-list" id="toc-list">
            <!-- Chapters will be dynamically injected here -->
        </ul>
    </aside>

    <script src="js/chapters.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
